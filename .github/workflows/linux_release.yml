name: Linux Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Generate Linux x64 Release Artifact
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev

    - name: Make Release Build
      run: bash Scripts/Linux/MakeReleaseBuild.sh --no-open

    - name: Get Version
      id: version
      run: echo "VERSION=$(cat VERSION.txt)" >> $GITHUB_OUTPUT

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Lost-${{ steps.version.outputs.VERSION }}-linux_x64
        path: Releases/Lost-${{ steps.version.outputs.VERSION }}-linux_x64.tar.gz
        if-no-files-found: error
        retention-days: 90
